# Dumps Xcode's PIF for small self-written projects that differ in one input each
# (.github/scripts/pif_experiments.py), to observe how Xcode derives synchronized-folder GUIDs
# and orders build phases (docs/formats/pif.md, open questions).
name: pif-experiments

on:
  # Manual only (Actions tab): macOS minutes are billed at 10x. The script also runs on any Mac
  # with Xcode 27.0 (docs/VERIFICATION.md "Without CI").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pif-experiments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(python3 -c 'import json; print(json.load(open("corpus/corpus.json"))["xcode"]["path"])')"
          xcodebuild -version
      - name: Run the experiments
        run: python3 .github/scripts/pif_experiments.py "$RUNNER_TEMP/experiments"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pif-experiments
          path: ${{ runner.temp }}/experiments
          retention-days: 30
