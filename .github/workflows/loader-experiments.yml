# Dumps Xcode's PIF (and -showBuildSettings where settings matter) for self-written projects
# that exercise loader features no corpus app has confirmed yet: version groups, aggregate and
# legacy targets, build rules, quoting of list settings, multi-project workspaces and project
# references (.github/scripts/loader_experiments.py, docs/formats/pif.md open questions).
name: loader-experiments

on:
  # Manual only (Actions tab): macOS minutes are billed at 10x. The script also runs on any Mac
  # with Xcode 27.0 (docs/VERIFICATION.md "Without CI").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loader-experiments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(python3 -c 'import json; print(json.load(open("corpus/corpus.json"))["xcode"]["path"])')"
          xcodebuild -version
      - name: Run the experiments
        run: python3 .github/scripts/loader_experiments.py "$RUNNER_TEMP/loader-experiments"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-experiments
          path: ${{ runner.temp }}/loader-experiments
          retention-days: 30
