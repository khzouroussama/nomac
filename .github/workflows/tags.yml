# Creates the milestone tags listed in .github/tags with the repository's own token, once the
# `ci` workflow has succeeded on the tagged commit (docs/adr/0007-milestone-tags.md).
name: tags

on:
  push:
    paths:
      - ".github/tags"
      - ".github/scripts/milestone-tags*.sh"
      - ".github/workflows/tags.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tags
  cancel-in-progress: false

jobs:
  tags:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the tagging script
        run: .github/scripts/milestone-tags-test.sh
      - name: Create tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/milestone-tags.sh .github/tags
